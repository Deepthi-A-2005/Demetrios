name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: 18.9.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps --force

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive --local --output ./demetrios.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: demetrios-apk
          path: ./demetrios.apk
